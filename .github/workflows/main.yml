name: Python application

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tools
      run: pip install pytest ruff mypy

    - name: Lint
      run: |
        ruff check .
        ruff format --check .
        mypy .

    - name: Test
      run: pytest
